[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-scraper-pipeline"
version = "1.1.0"
description = "Automated multi-board job scraper and candidate qualification pipeline with anti-bot bypass."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Aditya Parkhe"}
]
keywords = ["job-scraper", "naukri", "linkedin", "indeed", "glassdoor", "playwright", "jobspy"]
dependencies = [
    "python-jobspy>=1.1.50",
    "playwright>=1.40.0",
    "pandas>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0"
]

[project.scripts]
job-scrape = "run_scrape_and_fit:main"
job-track = "track_applications:main"

[tool.setuptools]
py-modules = ["naukri_scraper", "glassdoor_scraper", "run_scrape_and_fit", "track_applications"]

[tool.setuptools.package-data]
"*" = ["*.csv", "*.md"]
